<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}
    body{margin:0;background:#0d0f13;color:#f2f4f7;padding:18px}
    .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}.eye{width:34px;height:21px;border:2px solid #ff4f9f;border-radius:70% 35%;transform:rotate(45deg);position:relative}.eye:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#ff4f9f;left:11px;top:5px}.brand b{font-size:14px;letter-spacing:.08em}.brand small{display:block;color:#717985;font:9px ui-monospace;letter-spacing:.12em;margin-top:3px}
    h1{font-size:18px;margin:0 0 7px}p{font-size:11px;line-height:1.5;color:#9ba3ad;margin:0 0 15px}
    .steps{display:grid;gap:8px}button{width:100%;height:44px;border:1px solid #2b3038;border-radius:10px;background:#15181e;color:#eef1f5;text-align:left;padding:0 13px;font-weight:650;cursor:pointer}button:hover{border-color:#ff4f9f;background:#1c141b}button span{float:right;color:#ff4f9f;font:11px ui-monospace}
    #status{margin-top:14px;padding:11px;border:1px solid #272c34;border-radius:9px;background:#101216;color:#8f98a4;font:10px/1.45 ui-monospace;min-height:52px;white-space:pre-wrap}
    .note{margin-top:12px;color:#626b77;font:9px/1.4 ui-monospace}
  </style>
</head>
<body>
  <div class="brand"><div class="eye"></div><div><b>EYEVOICE</b><small>NATIVE FIGMA BUILDER</small></div></div>
  <h1>Сборка по блокам</h1>
  <p>Запускайте шаги сверху вниз. Каждый этап можно повторить: существующие результаты будут найдены по именам.</p>
  <div class="steps">
    <button onclick="run('foundations')">01 · Foundations <span>ТОКЕНЫ</span></button>
    <button onclick="run('components')">02 · Components <span>6 ШТ.</span></button>
    <button onclick="run('screen')">03 · Main Screen <span>1440×900</span></button>
    <button onclick="run('qa')">04 · QA & Focus <span>ПРОВЕРКА</span></button>
  </div>
  <div id="status">Готов к сборке.</div>
  <div class="note">Все созданные объекты имеют префикс EyeVoice и остаются полностью редактируемыми.</div>
  <script>
    const status = document.getElementById('status');
    function run(step){ status.textContent='Выполняю '+step+'…'; parent.postMessage({pluginMessage:{type:'run',step}},'*'); }
    onmessage = e => { const m=e.data.pluginMessage; if(m?.type==='status') status.textContent=m.text; };
  </script>
</body>
</html>
